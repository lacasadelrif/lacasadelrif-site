<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Casa del Rif | Próxima apertura</title>

  <meta
    name="description"
    content="La Casa del Rif — Próxima apertura. Una experiencia auténtica del Rif."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #183b32;
      --gold: #a67835;
      --cream: #f7f3ea;
      --text: #53635e;
      --white: #ffffff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
      color: var(--green);
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 20px;
    }

    .content {
      width: 100%;
      max-width: 850px;
      text-align: center;
      padding: 35px 20px;
    }

    /* LANGUAGE BUTTONS */

    .languages {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 38px;
    }

    .lang {
      border: 1px solid var(--green);
      background: transparent;
      color: var(--green);
      padding: 8px 15px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .lang:hover,
    .lang.active {
      background: var(--green);
      color: var(--white);
    }

    /* LOGO */

    .logo {
      width: 300px;
      max-width: 85%;
      height: auto;
      display: block;
      margin: 0 auto 28px;
    }

    /* BRAND */

    .brand {
      font-size: 15px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* MAIN TITLE */

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(45px, 11vw, 90px);
      line-height: 1;
      font-weight: normal;
      margin-bottom: 25px;
      color: var(--green);
    }

    /* GOLD LINE */

    .line {
      width: 75px;
      height: 2px;
      background: var(--gold);
      margin: 0 auto 30px;
    }

    /* OPENING */

    .opening {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--gold);
      font-size: clamp(27px, 5vw, 40px);
      margin-bottom: 22px;
    }

    /* DESCRIPTION */

    .description {
      max-width: 620px;
      margin: 0 auto;
      color: var(--text);
      font-size: 17px;
      line-height: 1.9;
    }

    /* CONTACT BUTTON */

    .buttons {
      margin-top: 38px;
    }

    .button {
      display: inline-block;
      padding: 14px 30px;
      border: 1px solid var(--green);
      border-radius: 30px;
      color: var(--green);
      background: transparent;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .button:hover {
      background: var(--green);
      color: var(--white);
    }

    /* CONTACT MODAL */

    .contact-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(24, 59, 50, 0.45);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .contact-modal.show {
      display: flex;
    }

    .contact-box {
      width: 100%;
      max-width: 400px;
      background: var(--cream);
      border-radius: 22px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      position: relative;
      border: 1px solid rgba(166, 120, 53, 0.35);
    }

    .contact-logo {
      width: 130px;
      max-width: 70%;
      height: auto;
      margin: 0 auto 15px;
      display: block;
    }

    .contact-title {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--green);
      font-size: 28px;
      margin-bottom: 7px;
    }

    .contact-subtitle {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .contact-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 18px;
      margin: 10px 0;
      border: 1px solid rgba(24, 59, 50, 0.25);
      border-radius: 14px;
      color: var(--green);
      background: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      transition: 0.25s ease;
    }

    .contact-link:hover {
      background: var(--green);
      color: var(--white);
      border-color: var(--green);
    }

    .close-contact {
      position: absolute;
      top: 12px;
      right: 15px;
      width: 35px;
      height: 35px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--green);
      font-size: 25px;
      cursor: pointer;
      line-height: 35px;
    }

    /* FOOTER */

    .footer {
      margin-top: 60px;
      color: #7b8580;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* ARABIC */

    html[dir="rtl"] .brand {
      letter-spacing: 1px;
    }

    html[dir="rtl"] .description {
      font-family: Arial, Tahoma, sans-serif;
      line-height: 2;
    }

    /* MOBILE */

    @media (max-width: 500px) {

      .page {
        padding: 15px;
      }

      .content {
        padding: 20px 8px;
      }

      .languages {
        margin-bottom: 30px;
      }

      .logo {
        width: 260px;
        max-width: 90%;
      }

      .brand {
        font-size: 12px;
        letter-spacing: 3px;
      }

      .description {
        font-size: 15px;
        line-height: 1.8;
      }

      .opening {
        font-size: 27px;
      }

      .footer {
        margin-top: 45px;
      }

      .contact-box {
        padding: 27px 18px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="content">

      <!-- LANGUAGE SELECTOR -->

      <div class="languages">

        <button
          class="lang active"
          onclick="setLanguage('es', this)"
        >
          ES
        </button>

        <button
          class="lang"
          onclick="setLanguage('ar', this)"
        >
          العربية
        </button>

        <button
          class="lang"
          onclick="setLanguage('en', this)"
        >
          EN
        </button>

      </div>


      <!-- LOGO -->

      <img
        class="logo"
        src="logo.png"
        alt="La Casa del Rif Restaurante"
      >


      <!-- BRAND -->

      <div class="brand">
        La Casa del Rif
      </div>


      <!-- TITLE -->

      <h1 id="welcome">
        Bienvenidos
      </h1>


      <!-- LINE -->

      <div class="line"></div>


      <!-- OPENING -->

      <div
        class="opening"
        id="opening"
      >
        Abrimos muy pronto
      </div>


      <!-- DESCRIPTION -->

      <p
        class="description"
        id="description"
      >
        Una nueva dirección llega muy pronto.
        La Casa del Rif prepara para vosotros
        una experiencia auténtica, cálida y llena
        de sabores.
      </p>


      <!-- CONTACT BUTTON -->

      <div class="buttons">

        <button
          class="button"
          onclick="openContact()"
          id="contact"
        >
          Contáctanos
        </button>

      </div>


      <!-- FOOTER -->

      <div class="footer">
        © 2026 La Casa del Rif
      </div>

    </section>

  </main>


  <!-- CONTACT MODAL -->

  <div
    class="contact-modal"
    id="contactModal"
    onclick="closeContactOutside(event)"
  >

    <div class="contact-box">

      <button
        class="close-contact"
        onclick="closeContact()"
        aria-label="Close"
      >
        ×
      </button>

      <img
        class="contact-logo"
        src="logo.png"
        alt="La Casa del Rif"
      >

      <div class="contact-title" id="contactTitle">
        Contáctanos
      </div>

      <div class="contact-subtitle" id="contactSubtitle">
        La Casa del Rif
      </div>


      <!-- PHONE -->

      <a
        class="contact-link"
        href="tel:+34666290425"
      >
        📞 +34 666 29 04 25
      </a>


      <!-- WHATSAPP -->

      <a
        class="contact-link"
        href="https://wa.me/34666290425"
        target="_blank"
        rel="noopener noreferrer"
      >
        💬 WhatsApp
      </a>


      <!-- INSTAGRAM -->

      <a
        class="contact-link"
        href="https://www.instagram.com/la_casa_del_rif/"
        target="_blank"
        rel="noopener noreferrer"
      >
        📸 Instagram
      </a>


      <!-- TIKTOK -->

      <a
        class="contact-link"
        href="https://www.tiktok.com/@lacasadelrif1"
        target="_blank"
        rel="noopener noreferrer"
      >
        🎵 TikTok
      </a>

    </div>

  </div>


  <script>

    const translations = {

      es: {
        title: "La Casa del Rif | Próxima apertura",
        welcome: "Bienvenidos",
        opening: "Abrimos muy pronto",
        description:
          "Una nueva dirección llega muy pronto. La Casa del Rif prepara para vosotros una experiencia auténtica, cálida y llena de sabores.",
        contact: "Contáctanos",
        contactTitle: "Contáctanos",
        contactSubtitle: "La Casa del Rif",
        direction: "ltr",
        language: "es"
      },

      ar: {
        title: "لا كاسا ديل ريف | الافتتاح قريباً",
        welcome: "مرحباً بكم",
        opening: "الافتتاح قريباً",
        description:
          "وجهة جديدة تفتح أبوابها قريباً. لا كاسا ديل ريف تحضر لكم تجربة أصيلة، دافئة ومليئة بالنكهات.",
        contact: "تواصل معنا",
        contactTitle: "تواصل معنا",
        contactSubtitle: "لا كاسا ديل ريف",
        direction: "rtl",
        language: "ar"
      },

      en: {
        title: "La Casa del Rif | Opening Soon",
        welcome: "Welcome",
        opening: "Opening soon",
        description:
          "A new destination is coming soon. La Casa del Rif is preparing an authentic, warm and flavorful experience for you.",
        contact: "Contact us",
        contactTitle: "Contact us",
        contactSubtitle: "La Casa del Rif",
        direction: "ltr",
        language: "en"
      }

    };


    function setLanguage(language, button) {

      const text = translations[language];

      document.title = text.title;

      document.documentElement.lang = text.language;

      document.documentElement.dir = text.direction;

      document.getElementById("welcome").textContent =
        text.welcome;

      document.getElementById("opening").textContent =
        text.opening;

      document.getElementById("description").textContent =
        text.description;

      document.getElementById("contact").textContent =
        text.contact;

      document.getElementById("contactTitle").textContent =
        text.contactTitle;

      document.getElementById("contactSubtitle").textContent =
        text.contactSubtitle;


      document
        .querySelectorAll(".lang")
        .forEach(function(btn) {
          btn.classList.remove("active");
        });


      button.classList.add("active");
    }


    function openContact() {

      document
        .getElementById("contactModal")
        .classList.add("show");

      document.body.style.overflow = "hidden";
    }


    function closeContact() {

      document
        .getElementById("contactModal")
        .classList.remove("show");

      document.body.style.overflow = "";
    }


    function closeContactOutside(event) {

      if (event.target === document.getElementById("contactModal")) {
        closeContact();
      }

    }


    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {
        closeContact();
      }

    });

  </script>

</body>
</html>
