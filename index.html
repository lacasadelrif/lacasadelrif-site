<!DOCTYPE html>
<html lang="es" dir="ltr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>La Casa del Rif | Próxima apertura</title>

  <meta
    name="description"
    content="La Casa del Rif — Restaurante. Próxima apertura."
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #183b32;
      --gold: #a67835;
      --cream: #f7f3ea;
      --text: #53635e;
      --white: #ffffff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
      color: var(--green);
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 20px;
    }

    .content {
      width: 100%;
      max-width: 850px;
      text-align: center;
      padding: 35px 20px;
    }


    /* =========================
       LANGUAGE BUTTONS
    ========================= */

    .languages {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 38px;
    }

    .lang {
      border: 1px solid var(--green);
      background: transparent;
      color: var(--green);
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .lang:hover,
    .lang.active {
      background: var(--green);
      color: var(--white);
    }


    /* =========================
       MAIN LOGO
    ========================= */

    .logo {
      width: 300px;
      max-width: 88%;
      height: auto;
      display: block;
      margin: 0 auto 28px;
    }


    /* =========================
       BRAND
    ========================= */

    .brand {
      font-size: 15px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: bold;
      margin-bottom: 20px;
    }


    /* =========================
       MAIN TITLE
    ========================= */

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(45px, 11vw, 90px);
      line-height: 1;
      font-weight: normal;
      margin-bottom: 25px;
      color: var(--green);
    }


    /* =========================
       GOLD LINE
    ========================= */

    .line {
      width: 75px;
      height: 2px;
      background: var(--gold);
      margin: 0 auto 30px;
    }


    /* =========================
       OPENING
    ========================= */

    .opening {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--gold);
      font-size: clamp(27px, 5vw, 40px);
      margin-bottom: 22px;
    }


    /* =========================
       DESCRIPTION
    ========================= */

    .description {
      max-width: 620px;
      margin: 0 auto;

      color: var(--text);
      font-size: 17px;
      line-height: 1.9;
    }


    /* =========================
       CONTACT BUTTON
    ========================= */

    .buttons {
      margin-top: 38px;
    }

    .button {
      display: inline-block;

      padding: 14px 32px;

      border: 1px solid var(--green);
      border-radius: 30px;

      color: var(--green);
      background: transparent;

      text-decoration: none;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.3s ease;
    }

    .button:hover {
      background: var(--green);
      color: var(--white);
    }


    /* =========================
       CONTACT MODAL
    ========================= */

    .contact-modal {

      display: none;

      position: fixed;

      inset: 0;

      background: rgba(24, 59, 50, 0.45);

      z-index: 9999;

      align-items: center;

      justify-content: center;

      padding: 20px;

    }

    .contact-modal.show {
      display: flex;
    }


    /* =========================
       CONTACT BOX
    ========================= */

    .contact-box {

      width: 100%;

      max-width: 430px;

      max-height: 90vh;

      overflow-y: auto;

      background: var(--cream);

      border-radius: 28px;

      padding: 32px 24px;

      text-align: center;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.22);

      position: relative;

      border: 1px solid rgba(166, 120, 53, 0.35);

    }


    /* =========================
       CONTACT LOGO
    ========================= */

    .contact-logo {

      width: 150px;

      max-width: 65%;

      height: auto;

      margin: 0 auto 18px;

      display: block;

    }


    /* =========================
       CONTACT TITLE
    ========================= */

    .contact-title {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: var(--green);

      font-size: 32px;

      margin-bottom: 8px;

    }


    .contact-subtitle {

      color: var(--gold);

      font-size: 13px;

      letter-spacing: 4px;

      text-transform: uppercase;

      margin-bottom: 28px;

      font-weight: bold;

    }


    /* =========================
       CLOSE BUTTON
    ========================= */

    .close-contact {

      position: absolute;

      top: 12px;

      right: 15px;

      width: 40px;

      height: 40px;

      border: none;

      background: transparent;

      color: var(--green);

      font-size: 34px;

      line-height: 40px;

      cursor: pointer;

      font-weight: 300;

    }


    /* =========================
       CONTACT LINKS
    ========================= */

    .contact-link {

      display: flex;

      align-items: center;

      justify-content: center;

      width: 100%;

      min-height: 72px;

      padding: 14px 18px;

      margin: 12px 0;

      border: 1px solid #ccd4d1;

      border-radius: 18px;

      color: var(--green);

      background: var(--white);

      text-decoration: none;

      font-size: 17px;

      font-weight: bold;

      transition: 0.25s ease;

      gap: 13px;

    }

    .contact-link:hover {

      transform: translateY(-2px);

      box-shadow:
        0 7px 20px rgba(0, 0, 0, 0.08);

    }


    /* =========================
       ICON
    ========================= */

    .contact-icon {

      width: 34px;

      height: 34px;

      min-width: 34px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      transition: transform 0.2s ease;

    }

    .contact-icon svg {

      width: 34px;

      height: 34px;

      display: block;

    }

    .contact-link:hover .contact-icon {

      transform: scale(1.08);

    }


    /* =========================
       PHONE ICON
    ========================= */

    .phone-icon {

      color: #183b32;

    }

    .phone-icon svg path {

      fill: currentColor;

    }


    /* =========================
       WHATSAPP ICON
    ========================= */

    .whatsapp-icon svg > path:first-child {

      fill: #25D366;

    }

    .whatsapp-icon .whatsapp-phone {

      fill: #ffffff;

    }


    /* =========================
       INSTAGRAM ICON
    ========================= */

    .instagram-icon svg {

      overflow: visible;

    }


    /* =========================
       TIKTOK ICON
    ========================= */

    .tiktok-icon svg {

      overflow: visible;

    }


    /* =========================
       FOOTER
    ========================= */

    .footer {

      margin-top: 60px;

      color: #7b8580;

      font-size: 13px;

      letter-spacing: 1px;

    }


    /* =========================
       ARABIC
    ========================= */

    html[dir="rtl"] .brand {

      letter-spacing: 1px;

    }

    html[dir="rtl"] .description {

      font-family:
        Arial,
        Tahoma,
        sans-serif;

      line-height: 2;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      .page {

        padding: 15px;

      }

      .content {

        padding: 20px 8px;

      }

      .languages {

        margin-bottom: 30px;

      }

      .logo {

        width: 270px;

        max-width: 90%;

      }

      .brand {

        font-size: 12px;

        letter-spacing: 3px;

      }

      .description {

        font-size: 15px;

        line-height: 1.8;

      }

      .opening {

        font-size: 27px;

      }

      .footer {

        margin-top: 45px;

      }

      .contact-box {

        padding: 28px 18px;

        border-radius: 26px;

      }

      .contact-logo {

        width: 145px;

      }

      .contact-title {

        font-size: 30px;

      }

      .contact-subtitle {

        font-size: 11px;

        letter-spacing: 3px;

      }

      .contact-link {

        min-height: 70px;

        font-size: 17px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       MAIN PAGE
  ========================= -->

  <main class="page">

    <section class="content">


      <!-- LANGUAGE SELECTOR -->

      <div class="languages">

        <button
          class="lang active"
          onclick="setLanguage('es', this)"
        >
          ES
        </button>

        <button
          class="lang"
          onclick="setLanguage('ar', this)"
        >
          العربية
        </button>

        <button
          class="lang"
          onclick="setLanguage('en', this)"
        >
          EN
        </button>

      </div>


      <!-- MAIN LOGO -->

      <img
        class="logo"
        src="logo.png"
        alt="La Casa del Rif Restaurante"
      >


      <!-- BRAND -->

      <div class="brand">

        La Casa del Rif

      </div>


      <!-- TITLE -->

      <h1 id="welcome">

        Bienvenidos

      </h1>


      <!-- GOLD LINE -->

      <div class="line"></div>


      <!-- OPENING -->

      <div
        class="opening"
        id="opening"
      >

        Abrimos muy pronto

      </div>


      <!-- DESCRIPTION -->

      <p
        class="description"
        id="description"
      >

        Una nueva dirección llega muy pronto.
        La Casa del Rif prepara para vosotros
        una experiencia auténtica, cálida y llena
        de sabores.

      </p>


      <!-- CONTACT -->

      <div class="buttons">

        <button
          class="button"
          onclick="openContact()"
          id="contact"
        >

          Contáctanos

        </button>

      </div>


      <!-- FOOTER -->

      <div class="footer">

        © 2026 La Casa del Rif

      </div>

    </section>

  </main>



  <!-- =========================
       CONTACT MODAL
  ========================= -->

  <div
    class="contact-modal"
    id="contactModal"
    onclick="closeContactOutside(event)"
  >


    <div class="contact-box">


      <!-- CLOSE -->

      <button
        class="close-contact"
        onclick="closeContact()"
        aria-label="Close"
      >

        ×

      </button>


      <!-- LOGO -->

      <img
        class="contact-logo"
        src="logo.png"
        alt="La Casa del Rif"
      >


      <!-- TITLE -->

      <div
        class="contact-title"
        id="contactTitle"
      >

        Contáctanos

      </div>


      <!-- SUBTITLE -->

      <div
        class="contact-subtitle"
        id="contactSubtitle"
      >

        LA CASA DEL RIF

      </div>



      <!-- =========================
           PHONE
      ========================= -->

      <a
        class="contact-link"
        href="tel:+34666290425"
      >

        <span class="contact-icon phone-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M6.6 2.9c.4-.4 1-.5 1.5-.2l3 1.5c.6.3.8 1 .6 1.6l-1.1 2.6c-.2.5-.1 1 .3 1.4l3.3 3.3c.4.4.9.5 1.4.3l2.6-1.1c.6-.3 1.3 0 1.6.6l1.5 3c.2.5.1 1.1-.2 1.5l-1.7 1.7c-.7.7-1.7 1-2.7.7-3.1-.9-6.2-2.9-9-5.7s-4.8-5.9-5.7-9c-.3-1 0-2 .7-2.7L6.6 2.9z"
            />

          </svg>

        </span>

        <span>
          +34 666 29 04 25
        </span>

      </a>



      <!-- =========================
           WHATSAPP
      ========================= -->

      <a
        class="contact-link"
        href="https://wa.me/34666290425"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="contact-icon whatsapp-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M12 2.2a9.7 9.7 0 0 0-8.4 14.6L2.4 21.7l5-1.1A9.7 9.7 0 1 0 12 2.2z"
            />

            <path

              d="M8.1 7.2c.2-.3.5-.4.8-.2l1.3.7c.3.2.4.5.3.8l-.5 1.1c-.1.3-.1.5.2.8l1.6 1.6c.2.2.5.3.8.2l1.1-.5c.3-.1.6 0 .8.3l.7 1.3c.2.3.1.7-.2.8l-.8.6c-.5.4-1.2.5-1.8.3-1.3-.5-2.7-1.4-3.9-2.6s-2.1-2.6-2.6-3.9c-.2-.6-.1-1.3.3-1.8l.6-.8z"
            />

          </svg>

        </span>

        <span>
          WhatsApp
        </span>

      </a>



      <!-- =========================
           INSTAGRAM
      ========================= -->

      <a
        class="contact-link"
        href="https://www.instagram.com/la_casa_del_rif/"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="contact-icon instagram-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <defs>

              <linearGradient

            <rect

            <circle

            <circle

      <!-- =========================

      ========================= -->

      <a

      >

          <svg

          >

            <!-- RED SHADOW -->

            <path
              d="M15.2 4.2c.5 1.7 1.5 2.8 3.1 3.4v2.2c-1.2-.2-2.3-.7-3.1-1.4v5.7a4.2 4.2 0 1 1-4.2-4.2c.3 0 .6 0 .9.1v2.5a1.7 1.7 0 1 0 .8 1.6V4.2h2.5z"
              fill="#FE2C55"
            />


            <!-- MAIN BLACK -->

            <path

              fill="#111111"
            />

          </svg>

        </span>

        <span>
          TikTok
        </span>

      </a>


    </div>

  </div>



  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>


    const translations = {


      es: {

        title:
          "La Casa del Rif | Próxima apertura",

        welcome:
          "Bienvenidos",

        opening:
          "Abrimos muy pronto",

        description:
          "Una nueva dirección llega muy pronto. La Casa del Rif prepara para vosotros una experiencia auténtica, cálida y llena de sabores.",

        contact:
          "Contáctanos",

        contactTitle:
          "Contáctanos",

        contactSubtitle:
          "LA CASA DEL RIF",

        direction:
          "ltr",

        language:
          "es"

      },


      ar: {

        title:
          "لا كاسا ديل ريف | الافتتاح قريباً",

        welcome:
          "مرحباً بكم",

        opening:
          "الافتتاح قريباً",

        description:
          "وجهة جديدة تفتح أبوابها قريباً. لا كاسا ديل ريف تحضر لكم تجربة أصيلة، دافئة ومليئة بالنكهات.",

        contact:
          "تواصل معنا",

        contactTitle:
          "تواصل معنا",

        contactSubtitle:
          "لا كاسا ديل ريف",

        direction:
          "rtl",

        language:
          "ar"

      },


      en: {

        title:
          "La Casa del Rif | Opening Soon",

        welcome:
          "Welcome",

        opening:
          "Opening soon",

        description:
          "A new destination is coming soon. La Casa del Rif is preparing an authentic, warm and flavorful experience for you.",

        contact:
          "Contact us",

        contactTitle:
          "Contact us",

        contactSubtitle:
          "LA CASA DEL RIF",

        direction:
          "ltr",

        language:
          "en"

      }

    };



    /* =========================
       LANGUAGE FUNCTION
    ========================= */

    function setLanguage(language, button) {


      const text =
        translations[language];


      document.title =
        text.title;


      document.documentElement.lang =
        text.language;


      document.documentElement.dir =
        text.direction;


      document.getElementById("welcome")
        .textContent =
        text.welcome;


      document.getElementById("opening")
        .textContent =
        text.opening;


      document.getElementById("description")
        .textContent =
        text.description;


      document.getElementById("contact")
        .textContent =
        text.contact;


      document.getElementById("contactTitle")
        .textContent =
        text.contactTitle;


      document.getElementById("contactSubtitle")
        .textContent =
        text.contactSubtitle;


      document
        .querySelectorAll(".lang")
        .forEach(function(btn) {

          btn.classList.remove("active");

        });


      button.classList.add("active");

    }



    /* =========================
       OPEN CONTACT
    ========================= */

    function openContact() {

      document
        .getElementById("contactModal")
        .classList.add("show");


      document.body.style.overflow =
        "hidden";

    }



    /* =========================
       CLOSE CONTACT
    ========================= */

    function closeContact() {

      document
        .getElementById("contactModal")
        .classList.remove("show");


      document.body.style.overflow =
        "";

    }



    /* =========================
       CLOSE BY CLICKING OUTSIDE
    ========================= */

    function closeContactOutside(event) {

      if (
        event.target ===
        document.getElementById("contactModal")
      ) {

        closeContact();

      }

    }



    /* =========================
       CLOSE WITH ESC
    ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          closeContact();

        }

      }
    );


  </script>


</body>

</html>
